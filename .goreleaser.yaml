version: 2

project_name: nanoku

before:
  hooks:
    - go mod tidy

builds:
  - id: nanoku
    main: .
    binary: nanoku
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      - -X main.buildType=release
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

dockers:
  - id: nanoku-ghcr
    use: buildx
    goos: linux
    goarch: [amd64, arm64]
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/nanoku:{{ .Version }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/nanoku:latest"
    build_args:
      VERSION: "{{ .Version }}"
      COMMIT: "{{ .ShortCommit }}"
      DATE: "{{ .Date }}"
    skip_push: auto
  - id: nanoku-dockerhub
    use: buildx
    goos: linux
    goarch: [amd64, arm64]
    dockerfile: Dockerfile
    image_templates:
      - "isaced/nanoku:{{ .Version }}"
      - "isaced/nanoku:latest"
    build_args:
      VERSION: "{{ .Version }}"
      COMMIT: "{{ .ShortCommit }}"
      DATE: "{{ .Date }}"
    skip_push: auto

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
  - id: zip
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
    overrides:
      - goos: windows

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug fixes
      regexp: "^fix"
    - title: Others
      order: 999

release:
  github:
    owner: isaced
    name: nanoku
  draft: false
  prerelease: auto
  header: |
    ## Docker

    Multi-arch images (`linux/amd64`, `linux/arm64`) are pushed to both registries.

    **GHCR**
    ```sh
    docker pull ghcr.io/isaced/nanoku:{{ .Version }}
    ```

    **Docker Hub**
    ```sh
    docker pull isaced/nanoku:{{ .Version }}
    ```

    GHCR is private by default — make the package public or run `docker login ghcr.io` first.
