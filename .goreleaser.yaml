version: 2

project_name: nanoku

before:
  hooks:
    - go mod tidy

builds:
  - id: nanoku
    main: .
    binary: nanoku
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
      - -X main.buildType=release
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# One entry per (registry × arch). Each builds a single-arch image; the
# `docker_manifests` block below stitches them into multi-arch tags
# (`:{{ .Version }}`, `:latest`) so users get the right arch automatically.
dockers:
  - id: dockerhub-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" }}true{{ else }}false{{ end }}'

  - id: dockerhub-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" }}true{{ else }}false{{ end }}'

  - id: ghcr-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"
    skip_push: auto

  - id: ghcr-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"
    skip_push: auto

# `docker_manifests` is deprecated in goreleaser v2 but still the only way to
# build multi-arch images without per-platform Dockerfile tricks. Bump when
# goreleaser ships a non-deprecated replacement.
docker_manifests:
  - name_template: "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" }}true{{ else }}false{{ end }}'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-arm64"
  - name_template: "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:latest"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" }}true{{ else }}false{{ end }}'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}-arm64"

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
  - id: zip
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
    format_overrides:
      - goos: windows

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug fixes
      regexp: "^fix"
    - title: Others
      order: 999

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  header: |
    ## Docker

    Multi-arch images (`linux/amd64`, `linux/arm64`) are pushed to both registries.

    {{ if ne .Env.DOCKERHUB_USERNAME "skip" -}}
    **Docker Hub**
    ```sh
    docker pull {{ .Env.DOCKERHUB_USERNAME }}/nanoku:{{ .Version }}
    ```

    {{ end -}}
    **GHCR**
    ```sh
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/nanoku:{{ .Version }}
    ```

    GHCR is private by default — make the package public or run `docker login ghcr.io` first.