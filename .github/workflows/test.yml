name: test

# Unit tests: go vet + go test -race + go build. Fast (~45s), runs on
# push/PR to both main and dev so regressions are caught during
# development, not just at PR-to-main time. End-to-end tests live in
# e2e.yml.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]

    steps:
      # Must run before the local composite action: GH needs the repo
      # on disk to resolve ./.github/actions/setup-build/action.yml.
      - uses: actions/checkout@v7

      # Shared setup (go + node + ui deps + ui build) lives in
      # .github/actions/setup-build — keep this in sync with e2e.yml.
      - name: Setup
        uses: ./.github/actions/setup-build
        with:
          go-version: ${{ matrix.go-version }}

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /tmp/nanoku-bin .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: nanoku-linux-amd64
          path: /tmp/nanoku-bin
          if-no-files-found: error
          retention-days: 1
