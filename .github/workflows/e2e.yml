name: e2e

# End-to-end tests: start a real nanoku + curl through the core API
# chain, real docker containers, and the caddy reverse proxy. Runs on
# ubuntu-latest (docker is preinstalled). Separate from test.yml (unit
# tests). Runs `make test-e2e`.
#
# Triggers on push/PR to both main and dev so regressions are caught
# during development, not just at PR-to-main time.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the e2e workdir after teardown so a failed run's logs
      # (server.log, Caddyfile, nanoku.db, deploy-logs/) survive for
      # the upload-artifact step below. teardown.sh still cleans up
      # docker containers/network/volume regardless.
      E2E_SKIP_WORKDIR_RM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # go:embed all:dist in internal/api/ui.go requires the UI build output to
      # exist, so build it before `go run .` (setup.sh spawns the server).
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Run E2E
        run: make test-e2e

      # On failure, upload the e2e workdir for diagnosis. Paths are
      # listed explicitly so .env (which holds NANOKU_SECRET_KEY and
      # E2E_ADMIN_PASSWORD) is never included in the artifact.
      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/nanoku-e2e/server.log
            /tmp/nanoku-e2e/caddy.log
            /tmp/nanoku-e2e/caddy-dir/Caddyfile
            /tmp/nanoku-e2e/nanoku.db
            /tmp/nanoku-e2e/deploy-logs
          if-no-files-found: warn
          retention-days: 7
