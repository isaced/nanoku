name: setup-build
description: |
  Checkout, install Go + Node, install UI deps, build the UI. The UI
  build is required because internal/api/ui.go go:embeds the dist
  output — without it, go test ./... and `go run .` both fail to
  compile. Used by both test.yml (unit tests) and e2e.yml (end-to-end
  tests) so the two workflows stay in lockstep on Go/Node versions
  and on what "ready to test" means.

inputs:
  go-version:
    description: 'Go version to install (e.g. "1.26").'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - uses: actions/setup-node@v4
      with:
        node-version: "26"
        cache: "npm"
        cache-dependency-path: ui/package-lock.json

    - name: Install UI dependencies
      working-directory: ui
      shell: bash
      run: npm ci

    - name: Build UI
      working-directory: ui
      shell: bash
      run: npm run build
